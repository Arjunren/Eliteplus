<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <title>ELITE+ Library</title>
    <link rel="icon" href="./static/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            neon: '#00eaff',
                            dark: '#020617', // Slate 950
                            card: '#1e293b', // Slate 800
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-dark text-slate-200 font-sans min-h-screen flex flex-col">

    <header class="fixed top-0 w-full z-40 bg-brand-dark/80 backdrop-blur-md border-b border-white/5 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <a href="#" class="text-3xl font-black tracking-wider text-white hover:opacity-80 transition-opacity">
                ELITES <span class="text-brand-neon drop-shadow-[0_0_8px_rgba(0,234,255,0.6)]">+</span>
            </a>

            <nav class="hidden md:flex items-center space-x-8">
                <a href="library.html" class="text-sm font-semibold text-brand-neon hover:text-white transition-colors">Home</a>
                <a href="movielibrary.html" class="text-sm font-semibold text-slate-300 hover:text-brand-neon transition-colors">Movies</a>
                <a href="serieslibrary.html" class="text-sm font-semibold text-slate-300 hover:text-brand-neon transition-colors">Series</a>
                
                <button id="logout" class="flex items-center gap-2 px-5 py-2 rounded-full border border-slate-700 bg-slate-800/50 hover:bg-red-500/20 hover:border-red-500/50 hover:text-red-400 transition-all duration-300 text-sm font-semibold">
                    <i class="ri-logout-box-r-line"></i> Logout
                </button>
            </nav>

            <button id="mobileMenuBtn" class="md:hidden text-2xl text-white focus:outline-none">
                <i class="ri-menu-4-line"></i>
            </button>
        </div>

        <div id="mobileMenu" class="hidden md:hidden bg-slate-900 border-b border-slate-800">
            <div class="flex flex-col p-4 space-y-4">
                <a href="library.html" class="text-brand-neon font-medium">Home</a>
                <a href="movielibrary.html" class="text-slate-300 hover:text-white font-medium">Movies</a>
                <a href="serieslibrary.html" class="text-slate-300 hover:text-white font-medium">Series</a>
                <a href="#" class="text-red-400 hover:text-red-300 font-medium">Logout</a>
            </div>
        </div>
    </header>

    <main class="flex-grow pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">

        <div class="flex flex-col items-center text-center space-y-6 mb-16 animate-fade-in">
            <div class="absolute top-20 left-1/2 -translate-x-1/2 w-64 h-64 bg-brand-neon opacity-10 blur-[100px] pointer-events-none"></div>

            <h1 class="text-4xl md:text-5xl font-extrabold text-white relative z-10">
                Welcome to <span class="text-brand-neon">ELITE +</span>
            </h1>
            
            <p class="text-slate-400 max-w-2xl text-lg relative z-10">
                Stream your favorite series and movies completely ready to watch.
            </p>

            <form id="searchForm" class="relative w-full max-w-lg mt-4 group z-10">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="ri-search-line text-slate-500 group-focus-within:text-brand-neon transition-colors text-xl"></i>
                </div>`
                <input 
                    type="text" 
                    id="query" 
                    placeholder="Search titles..." 
                    class="w-full pl-12 pr-4 py-4 bg-slate-800/60 border border-slate-700 rounded-2xl focus:outline-none focus:border-brand-neon focus:ring-1 focus:ring-brand-neon text-white placeholder-slate-500 transition-all shadow-lg backdrop-blur-sm"
                >
            </form>
        </div>

        <section class="space-y-12">
            
            <div>
                <div class="flex items-center gap-3 mb-6">
                    <div class="h-8 w-1 bg-brand-neon rounded-full"></div>
                    <h2 class="text-2xl font-bold text-white">Trending</h2>
                </div>
                
                <div id="moviesLibrary" class="library grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                    </div>
            </div>

            <div>
                <div id="tvLibrary" class="library grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
            </div>
            
        </section>

    </main>

    <div id="Modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm items-center justify-center p-4 transition-opacity duration-300">
        
        <div class="relative w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row max-h-[90vh]">
            
            <div class="relative md:w-2/5 h-64 md:h-auto bg-black shrink-0">
                <img id="modalPoster" class="w-full h-full object-cover opacity-90" src="" alt="Poster">
                <iframe id="modalTrailer" class="absolute inset-0 w-full h-full hidden" allow="autoplay; encrypted-media"></iframe>
                
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <i class="ri-play-circle-line text-6xl text-white/80 drop-shadow-lg"></i>
                </div>
            </div>

            <div class="p-6 md:p-8 flex flex-col justify-between overflow-y-auto w-full">
                <div>
                    <h3 id="modalTitle" class="text-2xl md:text-3xl font-bold text-white mb-4 leading-tight"></h3>
                    <p id="modalOverview" class="text-slate-300 text-sm leading-relaxed mb-6"></p>
                </div>

                <div class="flex flex-col gap-3 mt-auto">
                    <a id="detailsLink" class="cursor-pointer w-full py-3 bg-brand-neon hover:bg-cyan-400 text-brand-dark font-bold text-center rounded-xl transition-all shadow-lg hover:shadow-cyan-500/25 flex items-center justify-center gap-2">
                        <i class="ri-play-fill"></i> Play Now
                    </a>
                    
                    <button id="ModalClose" class="cursor-pointer w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold text-center rounded-xl border border-slate-700 transition-colors">
                        Close
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const btn = document.getElementById('mobileMenuBtn');
        const menu = document.getElementById('mobileMenu');
        const icon = btn.querySelector('i');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            if (menu.classList.contains('hidden')) {
                icon.classList.remove('ri-close-line');
                icon.classList.add('ri-menu-4-line');
            } else {
                icon.classList.remove('ri-menu-4-line');
                icon.classList.add('ri-close-line');
            }
        });

        // Close Modal Logic (Basic integration for the UI)
        // Note: Your main logic is in ./script/library.js, but this helper ensures the close button works UI-wise if the JS expects it.
        const modal = document.getElementById('Modal');
        const closeBtn = document.getElementById('ModalClose');
        
        closeBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            // Stop iframe video if playing
            const iframe = document.getElementById('modalTrailer');
            iframe.src = iframe.src; 
        });
    </script>

    <script src="./script/library.js"></script>

</body>
</html>
