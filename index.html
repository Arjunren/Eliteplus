<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · ELITE+</title>
  <link rel="icon" href="./static/icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./script/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body class="min-h-screen bg-ink-950 text-white relative overflow-hidden">

  <!-- cinematic background -->
  <div class="pointer-events-none absolute inset-0 -z-10">
    <div class="absolute inset-0 bg-gradient-to-b from-ink-900 via-ink-950 to-black"></div>
    <div class="absolute -top-40 -left-40 w-[36rem] h-[36rem] rounded-full bg-brand/20 blur-[120px]"></div>
    <div class="absolute -bottom-52 -right-32 w-[34rem] h-[34rem] rounded-full bg-indigo-600/20 blur-[120px]"></div>
    <div class="absolute inset-0 opacity-[0.04]"
      style="background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:34px 34px;"></div>
  </div>

  <main class="min-h-screen flex flex-col">
    <div class="px-6 sm:px-10 py-6">
      <span class="text-2xl font-extrabold tracking-tight">ELITE<span class="text-brand">+</span></span>
    </div>

    <div class="flex-1 grid place-items-center px-4 pb-16">
      <div class="w-full max-w-md animate-fade-up">
        <div class="rounded-3xl border border-white/10 bg-white/[0.04] backdrop-blur-2xl shadow-2xl shadow-black/60 p-8 sm:p-10">
          <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight">Welcome back</h1>
            <p class="mt-2 text-sm text-zinc-400">Sign in to continue to ELITE<span class="text-brand">+</span></p>
          </div>

          <form id="loginForm" class="space-y-5" novalidate>
            <div>
              <label for="Username" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Username</label>
              <div class="relative">
                <i class="ri-user-3-line absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                <input id="Username" type="text" autocomplete="username" required
                  class="w-full pl-10 pr-4 py-3 rounded-xl bg-ink-800/80 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand/50 transition"
                  placeholder="Enter your username" />
              </div>
            </div>

            <div>
              <label for="Password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Password</label>
              <div class="relative">
                <i class="ri-lock-2-line absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                <input id="Password" type="password" autocomplete="current-password" required
                  class="w-full pl-10 pr-12 py-3 rounded-xl bg-ink-800/80 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand/50 transition"
                  placeholder="Enter your password" />
                <button type="button" id="togglePass"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-xl transition">
                  <i class="ri-eye-off-line"></i>
                </button>
              </div>
            </div>

            <div id="errorBox"
              class="hidden items-center gap-2 rounded-xl border border-red-400/30 bg-red-500/10 text-red-200 text-sm px-4 py-3"></div>

            <button id="loginBtn" type="submit"
              class="w-full flex items-center justify-center gap-2 rounded-xl bg-brand hover:bg-brand-dark text-black font-bold py-3.5 shadow-lg shadow-brand/20 transition active:scale-[0.99] disabled:opacity-60 disabled:cursor-not-allowed">
              <span id="loginBtnText">Sign In</span>
              <i id="loginSpinner" class="ri-loader-4-line animate-spin hidden"></i>
            </button>
          </form>

          <p class="mt-6 text-center text-xs text-zinc-500">
            Need an account? Ask your ELITE<span class="text-brand">+</span> administrator.
          </p>
        </div>
      </div>
    </div>

    <footer class="text-center text-xs text-zinc-600 pb-6">
      ELITE+ © 2025–2026 · Streaming Reimagined
    </footer>
  </main>

  <script src="./script/config.js"></script>
  <script src="./script/index.js"></script>
</body>

</html>
