<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing · ELITE+</title>
  <link rel="icon" href="./static/icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./script/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>

<body class="bg-ink-950 text-white min-h-screen">
  <div id="ep-nav"></div>

  <main class="pt-20 sm:pt-24 px-3 sm:px-6 max-w-6xl mx-auto pb-16">
    <a href="library.html" class="inline-flex items-center gap-1.5 text-sm text-zinc-400 hover:text-white mb-3 transition"><i class="ri-arrow-left-line"></i> Back</a>

    <!-- player -->
    <div id="player" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden ring-1 ring-white/10 shadow-2xl">
      <div class="absolute inset-0 grid place-items-center text-zinc-500"><i class="ri-loader-4-line animate-spin text-4xl"></i></div>
    </div>

    <!-- source switcher + ad-shield note -->
    <div class="mt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div id="sources" class="flex flex-wrap gap-2"></div>
      <p id="shieldNote" class="hidden text-xs text-zinc-500 flex items-center gap-1.5">
        <i class="ri-shield-check-fill text-brand"></i> Ad-Shield on: pop-ups &amp; redirects blocked.
      </p>
    </div>

    <!-- info -->
    <section class="mt-8">
      <h1 id="title" class="text-2xl sm:text-4xl font-extrabold">Loading…</h1>
      <div id="metaRow" class="mt-3 flex flex-wrap items-center gap-2 text-sm text-zinc-400"></div>
      <p id="overview" class="mt-4 text-zinc-300 leading-relaxed max-w-3xl"></p>

      <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-x-10 gap-y-3 max-w-3xl text-sm">
        <div><span class="text-zinc-500">Genre:</span> <span id="genre" class="text-zinc-200"></span></div>
        <div><span class="text-zinc-500">Cast:</span> <span id="actors" class="text-zinc-200"></span></div>
        <div><span class="text-zinc-500">Director:</span> <span id="director" class="text-zinc-200"></span></div>
        <div><span class="text-zinc-500">Country:</span> <span id="country" class="text-zinc-200"></span></div>
        <div><span class="text-zinc-500">Release:</span> <span id="release" class="text-zinc-200"></span></div>
        <div><span class="text-zinc-500">Runtime:</span> <span id="duration" class="text-zinc-200"></span></div>
      </div>
    </section>
  </main>

  <footer class="border-t border-white/5 px-4 sm:px-8 py-8 text-center text-xs text-zinc-600">
    <p class="font-semibold text-zinc-400">ELITE<span class="text-brand">+</span> © 2025–2026</p>
    <p class="mt-1">Metadata by TMDb. ELITE+ does not host any media; it only links to third-party sources.</p>
  </footer>

  <script src="./script/config.js"></script>
  <script src="./script/player.js"></script>
  <script src="./script/movie.js"></script>
</body>

</html>
